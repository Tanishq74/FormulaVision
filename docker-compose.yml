version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: formula_pg
    restart: always
    environment:
      POSTGRES_USER: fv_user
      POSTGRES_PASSWORD: ffv_pass
      POSTGRES_DB: formulavision
    ports:
      - "5432:5432"
    volumes:
      - ./db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - formula_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: formula_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@formula.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5432:5432"
    depends_on:
      - postgres
    networks:
      - formula_net

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    networks:
      - formula_net

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - formula_net

networks:
  formula_net:

volumes:
  postgres_data:
